<h2 mat-dialog-title class="dialog-title">
    Delete {{ data.entityName }}
</h2>

<button
    type="button"
    class="close-button"
    mat-icon-button
    mat-dialog-close
    aria-label="Close dialog" 
    (click)="cancel()"   
>
    <mat-icon>close</mat-icon>
</button>

<mat-dialog-content>

    <div class="delete-content">

        <div class="warning-icon">
            <mat-icon>warning_amber</mat-icon>
        </div>

        <div class="message">

            <p class="question">
                Are you sure you want to delete this {{ data.entityName.toLowerCase() }}?
            </p>

            <p class="warning">
                This action cannot be undone.
            </p>

        </div>

    </div>

</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
    <button
        type="button"
        mat-button
        class="cancel-button"
        (click)="cancel()"
    >
        Cancel
    </button>

    <button
        type="button"
        mat-flat-button
        class="delete-button"
        (click)="confirm()"
    >
        Delete {{ data.entityName }}
    </button>
</mat-dialog-actions>
